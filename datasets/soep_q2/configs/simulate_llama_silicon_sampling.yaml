# Llama 3.1 8B Instruct | silicon_sampling | soep_q2

model_key: llama
method: silicon_sampling
hf_model: meta-llama/Llama-3.1-8B-Instruct

language: de          
batch_size: 32
max_new_tokens: 8    
flash_attention: false
enable_thinking: false  # Qwen3 ships a reasoning mode that breaks single-letter output
seed: 42

temperature: 0.7
do_sample: true

output_file: outputs/simulated_data/llama/silicon_sampling.csv