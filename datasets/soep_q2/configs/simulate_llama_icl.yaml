# Llama 3.1 8B Instruct | icl | soep_q2
 
model_key: llama
method: icl
hf_model: meta-llama/Llama-3.1-8B-Instruct
 
icl_k: 3
icl_index_dir: outputs/icl_index
icl_embed_model: paraphrase-multilingual-MiniLM-L12-v2
 
language: de
