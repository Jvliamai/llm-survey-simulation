# Qwen3 8B | ft | soep_q1 
model_key: qwen
method: ft
hf_model: Qwen/Qwen3-8B

adapter: outputs/models/qwen/lora   # set after fine-tuning

language: de          
batch_size: 32
max_new_tokens: 8     
flash_attention: false
enable_thinking: false  # Qwen3 ships a reasoning mode that breaks single-letter output
seed: 42

temperature: 0.7
do_sample: true

output_file: outputs/simulated_data/qwen/ft.csv