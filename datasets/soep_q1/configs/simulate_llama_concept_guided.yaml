# Llama 3.1 8B Instruct | concept_guided | soep_q1 

model_key: llama
method: concept_guided
hf_model: meta-llama/Llama-3.1-8B-Instruct

language: de          
batch_size: 32
max_new_tokens: 8     # a single letter; personas override this
flash_attention: false
enable_thinking: false  
seed: 42

temperature: 0.7
do_sample: true

output_file: outputs/simulated_data/llama/concept_guided.csv

persona_input: data/persona_input.csv
persona_file: outputs/personas/personas.csv
persona_model:
  hf_model: Qwen/Qwen3-8B   # one auxiliary model for all runs
  max_new_tokens: 400
  batch_size: 16